<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Oil UI — AI UI Design Skill</title>
  <desc id="desc">Bright exhibition-gallery showcase card for Oil UI, an AI UI design skill for Claude Code, Codex, and Cursor with 3-direction side-by-side HTML comparison, 117+ live works, and MIT plus Pro options.</desc>

  <!-- Warm gallery canvas with subtle architectural frame -->
  <rect x="1" y="1" width="1198" height="358" rx="26" fill="#F8F6F1" stroke="#E2DDD2" stroke-width="2"/>
  <path d="M56 76H556M56 286H556" stroke="#E6E1D6" stroke-width="1"/>

  <!-- Left: Editorial gallery typography -->
  <g id="title-block" transform="translate(56 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="12" fill="#435A47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">EXHIBITION GALLERY · UI DESIGN SKILL</text>

    <text x="0" y="102" fill="#171916" font-size="64" font-weight="750" letter-spacing="-2.2">Oil UI</text>

    <text x="0" y="148" fill="#2E332D" font-size="22" font-weight="500">AI UI Design Skill for Claude Code,</text>
    <text x="0" y="178" fill="#2E332D" font-size="22" font-weight="500">Codex &amp; Cursor</text>

    <g transform="translate(0 202)">
      <rect x="0" y="0" width="146" height="30" rx="15" fill="#435A47"/>
      <text x="73" y="20" text-anchor="middle" fill="#F8F6F1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">117+ Live Works</text>

      <rect x="158" y="0" width="106" height="30" rx="15" fill="#ECEAE2" stroke="#D5D0C3" stroke-width="1"/>
      <text x="211" y="20" text-anchor="middle" fill="#374038" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">MIT + Pro</text>

      <rect x="276" y="0" width="142" height="30" rx="15" fill="#ECEAE2" stroke="#D5D0C3" stroke-width="1"/>
      <text x="347" y="20" text-anchor="middle" fill="#374038" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">3-Way Compare</text>
    </g>

    <text x="0" y="274" fill="#63685F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">ui.oiloil.org/en  →</text>
  </g>

  <!-- Right: 3-Direction Side-by-Side Comparison Board -->
  <g id="comparison-board" transform="translate(592 34)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="0" y="0" width="554" height="292" rx="18" fill="#FFFFFF" stroke="#E2DDD2" stroke-width="1.5"/>

    <!-- Board top bar -->
    <path d="M0 44H554" stroke="#EDEAE2" stroke-width="1"/>
    <text x="20" y="27" fill="#5A6058" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1">SIDE-BY-SIDE DIRECTION COMPARE</text>
    <rect x="444" y="11" width="92" height="22" rx="11" fill="#EBF0EC"/>
    <text x="490" y="26" text-anchor="middle" fill="#435A47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">3 OPTIONS</text>

    <!-- Card A: Editorial -->
    <g transform="translate(18 60)">
      <rect x="0" y="0" width="162" height="214" rx="12" fill="#FAF7F0" stroke="#E5DFD2" stroke-width="1.2"/>
      <text x="14" y="24" fill="#7D7364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">DIR A · EDITORIAL</text>
      <rect x="14" y="38" width="96" height="12" rx="3" fill="#2A2621"/>
      <rect x="14" y="56" width="128" height="6" rx="3" fill="#BDB5A7"/>
      <rect x="14" y="68" width="108" height="6" rx="3" fill="#D4CEC3"/>
      <rect x="14" y="88" width="134" height="64" rx="8" fill="#EFE8DA" stroke="#DFD5C2" stroke-width="1"/>
      <rect x="24" y="100" width="52" height="8" rx="2" fill="#C86D44"/>
      <rect x="24" y="116" width="106" height="5" rx="2" fill="#A99E8D"/>
      <rect x="24" y="127" width="84" height="5" rx="2" fill="#C4BBAE"/>
      <rect x="14" y="166" width="62" height="26" rx="6" fill="#EDE7DA"/>
      <rect x="84" y="166" width="64" height="26" rx="6" fill="#EDE7DA"/>
    </g>

    <!-- Card B: Gallery (Selected with sage selection ring & corner handles) -->
    <g transform="translate(196 60)">
      <rect x="-3" y="-3" width="168" height="220" rx="14" fill="none" stroke="#435A47" stroke-width="2"/>
      <rect x="0" y="0" width="162" height="214" rx="12" fill="#F4F6F4" stroke="#9AB3B6" stroke-width="1"/>
      <!-- Corner handles -->
      <rect x="-6" y="-6" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#435A47" stroke-width="1.8"/>
      <rect x="160" y="-6" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#435A47" stroke-width="1.8"/>
      <rect x="-6" y="212" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#435A47" stroke-width="1.8"/>
      <rect x="160" y="212" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#435A47" stroke-width="1.8"/>

      <text x="14" y="24" fill="#435A47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">DIR B · GALLERY</text>
      <rect x="14" y="38" width="112" height="12" rx="3" fill="#171916"/>
      <rect x="14" y="56" width="132" height="6" rx="3" fill="#8B9890"/>
      <rect x="14" y="74" width="62" height="72" rx="8" fill="#435A47"/>
      <rect x="24" y="90" width="38" height="6" rx="2" fill="#D9E4DC"/>
      <rect x="24" y="102" width="30" height="5" rx="2" fill="#9AB3B6"/>
      <rect x="84" y="74" width="64" height="32" rx="7" fill="#FFFFFF" stroke="#D5DDD8" stroke-width="1"/>
      <rect x="84" y="114" width="64" height="32" rx="7" fill="#E3EAE6" stroke="#C5D2CB" stroke-width="1"/>
      <!-- Selected status pill -->
      <rect x="14" y="164" width="134" height="30" rx="8" fill="#435A47"/>
      <text x="81" y="183" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">PICKED · REVIEW</text>
    </g>

    <!-- Card C: Dark Studio -->
    <g transform="translate(374 60)">
      <rect x="0" y="0" width="162" height="214" rx="12" fill="#181B20" stroke="#2C313A" stroke-width="1.2"/>
      <text x="14" y="24" fill="#98A2B3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">DIR C · STUDIO</text>
      <rect x="14" y="38" width="92" height="12" rx="3" fill="#F3F5F8"/>
      <rect x="14" y="56" width="126" height="6" rx="3" fill="#5D6675"/>
      <rect x="14" y="76" width="134" height="52" rx="8" fill="#232830" stroke="#343B46" stroke-width="1"/>
      <circle cx="32" cy="96" r="6" fill="#9AB3B6"/>
      <rect x="46" y="91" width="76" height="5" rx="2" fill="#CBD2DC"/>
      <rect x="46" y="102" width="52" height="5" rx="2" fill="#6F7989"/>
      <rect x="14" y="140" width="134" height="20" rx="5" fill="#232830"/>
      <rect x="14" y="168" width="134" height="24" rx="6" fill="#2F3743"/>
    </g>
