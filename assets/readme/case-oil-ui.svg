<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Oil UI — 把 AI 的 UI 设计能力推到极限</title>
  <desc id="desc">明亮画廊风格的 Oil UI 中文展示卡：展示多方向同屏对比与真浏览器截图打磨流程，支持 MIT 开源版与买断 Pro 版。</desc>

  <!-- Crisp gallery alabaster canvas -->
  <rect x="1" y="1" width="1198" height="358" rx="26" fill="#F7F6F2" stroke="#DFDDD4" stroke-width="2"/>
  <path d="M56 76H556M56 286H556" stroke="#E5E2D9" stroke-width="1"/>

  <!-- Left: Gallery Chinese Typography -->
  <g id="title-block" transform="translate(56 44)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', sans-serif">
    <text x="0" y="12" fill="#435A47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">UI DESIGN SKILL · 117+ 实战作品</text>

    <text x="0" y="102" fill="#171916" font-size="64" font-weight="760" letter-spacing="-2.2">Oil UI</text>

    <text x="0" y="150" fill="#232822" font-size="23" font-weight="600">把 AI 的 UI 设计能力推到极限</text>
    <text x="0" y="182" fill="#5D645C" font-size="19" font-weight="450">多方向并排对比与真浏览器截图打磨</text>

    <g transform="translate(0 206)" font-size="13" font-weight="600">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#435A47"/>
      <text x="60" y="20" text-anchor="middle" fill="#FFFFFF">同屏三方向对比</text>

      <rect x="132" y="0" width="108" height="30" rx="15" fill="#EBEAE2" stroke="#D4D1C6" stroke-width="1"/>
      <text x="186" y="20" text-anchor="middle" fill="#374038">真浏览器复查</text>

      <rect x="252" y="0" width="104" height="30" rx="15" fill="#EBEAE2" stroke="#D4D1C6" stroke-width="1"/>
      <text x="304" y="20" text-anchor="middle" fill="#374038">MIT + Pro</text>
    </g>

    <text x="0" y="274" fill="#63685F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">ui.oiloil.org  →</text>
  </g>

