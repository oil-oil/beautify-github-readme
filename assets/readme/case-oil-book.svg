<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Oil Book — AI 实战课程与精译专栏</title>
  <desc id="desc">暖纸编辑出版风格的 Oil Book 展示卡：展示免费基石长文与 Pro 体系化实战目录预览，涵盖 Vibe Coding、AI 产品设计与独立商业化。</desc>

  <!-- Warm book-paper canvas -->
  <rect x="1" y="1" width="1198" height="358" rx="26" fill="#FAF5EA" stroke="#E5D8BF" stroke-width="2"/>
  <path d="M56 76H546M56 286H546" stroke="#E6DAC2" stroke-width="1"/>

  <!-- Left: Editorial book colophon -->
