    <text x="0" y="100" fill="#1F1B16" font-family="Georgia, 'Songti SC', 'STSong', serif" font-size="62" font-weight="700" letter-spacing="-1.2">Oil Book</text>
    <rect x="2" y="114" width="64" height="5" rx="2.5" fill="#F2B824"/>

    <text x="0" y="158" fill="#2E2820" font-size="23" font-weight="600">AI 实战课程与精译专栏</text>
    <text x="0" y="190" fill="#63584A" font-size="19" font-weight="450">免费基石长文 + Pro 体系化实战</text>

    <g transform="translate(0 212)" font-size="13" font-weight="600">
      <rect x="0" y="0" width="118" height="28" rx="14" fill="#F3E7CC" stroke="#E2CF9F" stroke-width="1"/>
      <text x="59" y="19" text-anchor="middle" fill="#6D4D08">Vibe Coding</text>

      <rect x="128" y="0" width="96" height="28" rx="14" fill="#F3E7CC" stroke="#E2CF9F" stroke-width="1"/>
      <text x="176" y="19" text-anchor="middle" fill="#6D4D08">AI 好设计</text>

      <rect x="234" y="0" width="108" height="28" rx="14" fill="#F3E7CC" stroke="#E2CF9F" stroke-width="1"/>
      <text x="288" y="19" text-anchor="middle" fill="#6D4D08">独立商业化</text>
    </g>

    <text x="0" y="276" fill="#7D6F5D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">book.oiloil.org  →</text>
  </g>

  <!-- Right: Warm Paper Book Spread / Chapter Index Preview -->
  <g id="book-spread" transform="translate(580 30)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', sans-serif">
    <!-- Subtle book page backing shadow layer -->
    <rect x="10" y="8" width="556" height="292" rx="16" fill="#EFE5D0" stroke="#DFD0B2" stroke-width="1"/>
    <!-- Main open page -->
    <rect x="0" y="0" width="556" height="292" rx="16" fill="#FFFDF8" stroke="#E2D5BC" stroke-width="1.5"/>

    <!-- Bookmark ribbon on top right -->
    <path d="M500 0H530V44L515 34L500 44V0Z" fill="#C24B32"/>

    <!-- Page header -->
