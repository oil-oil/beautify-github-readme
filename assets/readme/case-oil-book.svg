    <path d="M26 116H528" stroke="#F0E8D8" stroke-width="1"/>

    <!-- Chapter 02 -->
    <g transform="translate(26 128)">
      <text x="0" y="18" fill="#B57E0A" font-family="Georgia, serif" font-size="18" font-weight="700">02</text>
      <text x="38" y="18" fill="#1F1B16" font-size="17" font-weight="700">AI 产品与好设计</text>
      <text x="38" y="38" fill="#766A5A" font-size="13">摆脱 AI 模板感，从需求判断到界面打磨</text>
      <rect x="404" y="4" width="96" height="24" rx="12" fill="#FDF2D6" stroke="#E9CD82" stroke-width="1"/>
      <text x="452" y="20" text-anchor="middle" fill="#8C6106" font-size="12" font-weight="700">Pro 实战</text>
    </g>
    <path d="M26 180H528" stroke="#F0E8D8" stroke-width="1"/>

    <!-- Chapter 03 -->
    <g transform="translate(26 192)">
      <text x="0" y="18" fill="#B57E0A" font-family="Georgia, serif" font-size="18" font-weight="700">03</text>
      <text x="38" y="18" fill="#1F1B16" font-size="17" font-weight="700">独立商业化与自媒体创作</text>
      <text x="38" y="38" fill="#766A5A" font-size="13">定价策略、海外收款接入与持续分发路径</text>
      <rect x="404" y="4" width="96" height="24" rx="12" fill="#FDF2D6" stroke="#E9CD82" stroke-width="1"/>
      <text x="452" y="20" text-anchor="middle" fill="#8C6106" font-size="12" font-weight="700">Pro 实战</text>
    </g>
    <path d="M26 244H528" stroke="#F0E8D8" stroke-width="1"/>

    <!-- Chapter 04 -->
    <g transform="translate(26 254)">
      <text x="0" y="18" fill="#B57E0A" font-family="Georgia, serif" font-size="18" font-weight="700">04</text>
      <text x="38" y="18" fill="#1F1B16" font-size="16" font-weight="700">海外工程一手精译与模型参考</text>
      <rect x="404" y="0" width="96" height="24" rx="12" fill="#F4EFE4" stroke="#DED2BC" stroke-width="1"/>
      <text x="452" y="16" text-anchor="middle" fill="#63584A" font-size="12" font-weight="700">公开精译</text>
